<script type="text/plain" id="ocr-src">
// 渡表僧 · 本地认字。在 Worker 里跑，不卡页面。模型是 PP-OCRv5 mobile（Apache-2.0）：det 找字在哪，rec 一段段认。
// 先把图收拾干净：压平阴影 → 扶正 → 找出表格线（交给拼表）并擦掉（免得被认成 1 或 |）。
let ort = null, det = null, rec = null, dict = null;

async function grab(url, cacheName) {      // 下载一次，存进浏览器的 Cache Storage，下回直接拿
  let cache = null;
  try { cache = await caches.open(cacheName); } catch (e) { /* 没有 Cache Storage 就每次下 */ }
  if (cache) {
    const hit = await cache.match(url);
    if (hit) { const b = await hit.arrayBuffer(); postMessage({ type: 'dl', url, got: b.byteLength, cached: true }); return b; }
  }
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url.split('/').pop()} 没下载下来：HTTP ${res.status}`);
  const reader = res.body.getReader(), parts = [];
  let got = 0, last = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    parts.push(value); got += value.length;
    if (got - last > 262144) { last = got; postMessage({ type: 'dl', url, got }); }
  }
  const buf = new Uint8Array(got);
  let o = 0;
  for (const p of parts) { buf.set(p, o); o += p.length; }
  postMessage({ type: 'dl', url, got });
  if (cache) { try { await cache.put(url, new Response(buf.slice())); } catch (e) { /* 存不下就算了，下回再下 */ } }
  return buf.buffer;
}

async function init(m) {
  if (rec) return;
  ort = await import(m.ort + 'ort.wasm.min.mjs');
  ort.env.wasm.numThreads = 1;
  ort.env.logLevel = 'error';
  ort.env.wasm.wasmPaths = m.ort;
  ort.env.wasm.wasmBinary = await grab(m.ort + 'ort-wasm-simd-threaded.wasm', m.cache);
  const opt = { executionProviders: ['wasm'], graphOptimizationLevel: 'all' };
  dict = new TextDecoder().decode(await grab(m.dict, m.cache)).split(/\r?\n/);
  if (dict[dict.length - 1] === '') dict.pop();
  det = await ort.InferenceSession.create(new Uint8Array(await grab(m.det, m.cache)), opt);
  rec = await ort.InferenceSession.create(new Uint8Array(await grab(m.rec, m.cache)), opt);
}

// ---------------------------------------------------------------- 收拾图
function gray(rgba, W, H) {
  const g = new Uint8Array(W * H);
  for (let i = 0, j = 0; i < g.length; i++, j += 4) g[i] = (rgba[j] * 299 + rgba[j + 1] * 587 + rgba[j + 2] * 114) / 1000;
  return g;
}
// 拍照的：透视让表上宽下窄、竖线不平行。表的顶线和底线实际一样长，拿它们的四个端点把整张图拉回长方形
function solve8(A, b) {
  const n = b.length, M = A.map((r, i) => r.concat([b[i]]));
  for (let c = 0; c < n; c++) {
    let p = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    [M[c], M[p]] = [M[p], M[c]];
    if (Math.abs(M[c][c]) < 1e-12) return null;
    for (let r = 0; r < n; r++) if (r !== c) { const f = M[r][c] / M[c][c]; for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k]; }
  }
  return M.map((r, i) => r[n] / r[i]);
}
function looksPhoto(g, W, H) {      // 图的四边一圈明显比中间暗：拍到了桌面
  const bw = Math.max(4, Math.round(0.03 * Math.min(W, H)));
  let es = 0, en = 0, cs = 0, cn = 0;
  for (let y = 0; y < H; y += 3) for (let x = 0; x < W; x += 3) {
    const v = g[y * W + x];
    if (x < bw || y < bw || x >= W - bw || y >= H - bw) { es += v; en++; } else if (x > W / 4 && x < 3 * W / 4 && y > H / 4 && y < 3 * H / 4) { cs += v; cn++; }
  }
  return en && cn && es / en < 0.6 * (cs / cn);
}
function tableQuad(L, W, H, photo) {
  const hs = L.H.filter((h) => h.x1 - h.x0 > 0.25 * W);
  if (hs.length < 2) return null;

const normCell = (v) => half(v ?? '').replace(/\s+/g, '').replace(/，/g, ',');

// 几遍的结果投票：同形状的几遍逐格比，过半的算数；没过半的标红。形状都对不上就用第一遍、整张标黄
function vote(reads) {
  const shapes = reads.map(shapeOf);

  shapes.forEach((s) => count.set(s, (count.get(s) || 0) + 1));
  let best = shapes[0];
  for (const [s, n] of count) if (n > count.get(best)) best = s;
  const same = reads.filter((_, i) => shapes[i] === best);
  return same[0].map((t, ti) => {
    const all = (rd) => rd[ti].header.concat(rd[ti].rows);
    const grid = all(same[0]);
    const nc = Math.max(1, ...grid.map((r) => r.length));
    const cells = grid.map((row, r) => Array.from({ length: nc }, (_, c) => {
      const vals = same.map((rd) => (all(rd)[r] || [])[c] ?? '');
      return vals;
    }));
    const flags = new Map();
    const out = cells.map((row, r) => row.map((vals, c) => {
      const tally = new Map();
      vals.forEach((v) => { const k = normCell(v); tally.set(k, (tally.get(k) || 0) + 1); });
      let top = normCell(vals[0]);
      for (const [k, n] of tally) if (n > tally.get(top)) top = k;
      const winner = vals.find((v) => normCell(v) === top);
      if (same.length >= 2 && tally.get(top) * 2 <= vals.length) flags.set(`${r},${c}`, { why: `认了 ${vals.length} 遍不一样：${vals.map((v) => v || '（空）').join(' / ')}`, color: 'r' });

async function renderPage(page, enhance) {
  const vp0 = page.getViewport({ scale: 1 });
  const scale = Math.min(4, MAX_SIDE / Math.max(vp0.width, vp0.height));
  const vp = page.getViewport({ scale });
  const cv = document.createElement('canvas');
  cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
  const ctx = cv.getContext('2d', { willReadFrequently: enhance });
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  await page.render({ canvasContext: ctx, canvas: cv, viewport: vp }).promise;
  if (enhance) {           // 第二遍用灰度、拉过对比度的图：两遍看到的东西不完全一样，对答案才有意义
    const im = ctx.getImageData(0, 0, cv.width, cv.height), d = im.data, hist = new Uint32Array(256);

    while (lo < 255 && (acc += hist[lo]) < n * 0.01) lo++;

  if (!sameRead(reads[0], reads[1])) reads.push(await eng.read(plain, name));

  const pp = {
    no: pg.no, items, ocr: true, top: Hpt, bottom: 0, height: Hpt,
    H: mergeLines(r.H.map((h) => ({ y: Hpt - (h.y0 + h.y1) / 2 / s, a: h.x0 / s, b: h.x1 / s })), 'y'),
    V: mergeLines(r.V.map((v) => ({ x: (v.x0 + v.x1) / 2 / s, a: Hpt - v.y1 / s, b: Hpt - v.y0 / s })), 'x'),
  };
  const tables = pageTables(pp);
  tables.forEach(ocrFix);
  Object.assign(pg, { top: Hpt, bottom: 0, height: Hpt, free: pp.free, ocrLines: toLines(items).map((L) => L.segs.map((sg) => sg.s)) });
  (T.ocr = T.ocr || []).push({ page: pg.no, engine: OCR_ENGINE, ms: Math.round(performance.now() - t0), parts: r.ms, angle: r.angle, quad: !!r.quad, boxes: r.boxes,
    words: r.words.length, lines: [r.H.length, r.V.length], W, H, debug: LOCAL && Q.get('debug') ? r.words : undefined, hv: LOCAL && Q.get('debug') ? { H: r.H, V: r.V } : undefined });
  return tables;
}

// 认完以后：数字列里认成字母的改回数字（标橙），没把握的标黄
const CONFUSE = { O: '0', o: '0', D: '0', Q: '0', I: '1', l: '1', '|': '1', i: '1', '!': '1', Z: '2', z: '2', S: '5', s: '5', B: '8', G: '6', b: '6', g: '9', q: '9' };
const goodNum = (v) => { const c = parseCell(v); return !!c && !c.warn && (c.t === 'n' || c.t === 'd' || !!c.code); };
const tidyNum = (v) => half(v).replace(/，/g, ',').replace(/[。．]/g, '.').replace(/[—–－]/g, '-').replace(/([\d,.(+\-%$¥])\s+(?=[\d,.)%])/g, '$1');
function ocrFix(t) {
  const H = t.headerRows, R = t.cells.length, numCol = [];
  for (let c = 0; c < t.ncols; c++) {
    let n = 0, all = 0;
    for (let r = H; r < R; r++) { const v = t.cells[r][c]; if (v == null || v === '') continue; all++; if (goodNum(tidyNum(v))) n++; }
    numCol[c] = all > 0 && n >= 0.6 * all;
  }
  for (let r = H; r < R; r++) for (let c = 0; c < t.ncols; c++) {
    const v = t.cells[r][c];
    if (v == null) continue;
    const key = `${r},${c}`, ps = (t.src.get(key) || []).flatMap((p) => p.p || []);
    const sure = ps.length ? Math.min(...ps) : 1;
    if (numCol[c] && /\d/.test(v)) {
      let w = tidyNum(v);
      if (!goodNum(w)) {
        let bare = w.replace(/^[!|'`‘’":;,.]+|[!|'`‘’":;]+$/g, '');
        if (/\)$/.test(bare) && !/^\(/.test(bare)) bare = bare.slice(0, -1);
        const fixed = (goodNum(bare) ? bare : w).replace(/[ODQIl|i!ZzSsBGbgqo]/g, (ch) => CONFUSE[ch]);
        if (fixed !== w && goodNum(fixed)) { t.flags.set(key, { why: `认出来是「${v}」，按数字改成了「${fixed}」`, color: 'o' }); w = fixed; }
      }
      if (w !== v) t.cells[r][c] = w;
      if (!t.flags.has(key) && sure < OCR_SURE_NUM) t.flags.set(key, { why: `本地认的，这格没把握（${Math.round(sure * 100)} 分）`, color: 'y' });
    } else if (sure < OCR_SURE_TEXT) t.flags.set(key, { why: `本地认的，这格没把握（${Math.round(sure * 100)} 分）`, color: 'y' });
  }
  // 数字列里别的行都有数、这行别的格也都有字，偏偏这格空着：多半是漏认了
  for (let c = 0; c < t.ncols; c++) {
    if (!numCol[c]) continue;
    let filled = 0;
    for (let r = H; r < R; r++) if (t.cells[r][c] != null && t.cells[r][c] !== '') filled++;
    if (filled < 0.85 * (R - H)) continue;
    for (let r = H; r < R; r++) {
      if (t.cells[r][c] != null && t.cells[r][c] !== '') continue;
      const rowFilled = t.cells[r].filter((v) => v != null && v !== '').length;
      if (rowFilled >= 0.6 * t.ncols && !t.flags.has(`${r},${c}`)) t.flags.set(`${r},${c}`, { why: '这列别的行都有数，这格空着，可能漏认了', color: 'y' });
    }
  }
  // 同一列小数位数对不上的：多半是小数点没认出来，或者多认了一位
  for (let c = 0; c < t.ncols; c++) {
    if (!numCol[c]) continue;
    const decs = [];
    for (let r = H; r < R; r++) {
      const v = t.cells[r][c], x = v == null ? null : parseCell(v);
      if (x && x.t === 'n') decs.push([r, (half(v).match(/\.(\d+)/) || ['', ''])[1].length]);
    }
    const cnt = new Map();
    decs.forEach(([, d]) => cnt.set(d, (cnt.get(d) || 0) + 1));
    const [mode, n] = [...cnt].sort((p, q) => q[1] - p[1])[0] || [0, 0];
    if (decs.length < 4 || n < 0.75 * decs.length) continue;
    for (const [r, d] of decs) {
      if (d !== mode && !t.flags.has(`${r},${c}`)) t.flags.set(`${r},${c}`, { why: `这列别的都是 ${mode} 位小数，这格是 ${d} 位`, color: 'y' });
    }
  }
  delete t.src;
}

async function localScans(pages, lo) {
  try { await ocrReady(); } catch (e) { for (const p of pages) p.localError = e.message; return; }
  let done = 0;
  for (const pg of pages) {
    say(`贫僧本地认字：第 ${pg.no} 页（${done + 1} / ${pages.length}）`);
    try { pg.tables = await readLocal(job.doc, pg); pg.via = 'local'; pg.localError = ''; }
    catch (e) { pg.localError = e.message || String(e); }
    done++;
    bar(lo + (0.92 - lo) * done / pages.length);
  }
}

// ================================================================ 写 Excel
const FILL = { y: 'FFFFF2CC', o: 'FFF8CBAD', r: 'FFFFC7CE' };
const thin = { style: 'thin', color: { argb: 'FFD1D1D6' } };
const BORDER = { top: thin, left: thin, bottom: thin, right: thin };
function colName(c) { let s = ''; c++; while (c) { const m = (c - 1) % 26; s = String.fromCharCode(65 + m) + s; c = (c - m - 1) / 26; } return s; }
function sheetName(s, used) {
  let n = String(s).replace(/[\[\]:*?/\\]/g, ' ').slice(0, 31) || '表';
  let k = 2, base = n;
  while (used.has(n)) n = `${base.slice(0, 27)} (${k++})`;
  used.add(n);
  return n;
}
function pagesText(ps) {
  if (!ps.length) return '';
  const out = [];
  let a = ps[0], b = ps[0];
  for (const p of ps.slice(1).concat([null])) {
    if (p === b + 1) { b = p; continue; }
    out.push(a === b ? `${a}` : `${a}–${b}`);
    a = b = p;
  }
  return out.join('、');
}
async function waitExcelJS() {
  for (let i = 0; i < 300 && !window.ExcelJS; i++) await new Promise((ok) => setTimeout(ok, 100));
  if (!window.ExcelJS) throw new Error('Excel 的库没从网上下载下来（cdn.jsdelivr.net），网络好了刷新再试');
  return window.ExcelJS;
}
async function buildWorkbook(job) {
  const ExcelJS = await waitExcelJS();
  const wb = new ExcelJS.Workbook();
  wb.creator = '渡表僧';
  wb.created = new Date();
  const used = new Set();
  job.tables.forEach((t, ti) => {
    t.sheet = sheetName(`表${ti + 1}`, used);
    const ws = wb.addWorksheet(t.sheet, t.headerRows ? { views: [{ state: 'frozen', ySplit: t.headerRows, xSplit: 0 }] } : {});
    const widths = Array(t.ncols).fill(6);
    t.typed.forEach((row, r) => {
      const xr = ws.getRow(r + 1);
      for (let c = 0; c < t.ncols; c++) {
        const x = row[c], cell = xr.getCell(c + 1);
        if (x) {
          if (x.t === 'n') { cell.value = x.v; if (x.fmt) cell.numFmt = x.fmt; }
          else if (x.t === 'd') { cell.value = new Date(Date.UTC(x.v[0], x.v[1] - 1, x.v[2])); cell.numFmt = x.fmt; }
          else { cell.value = x.v; if (x.code) cell.numFmt = '@'; }
          const shown = t.cells[r][c] == null ? '' : String(t.cells[r][c]);
          if (!t.merges.some((m) => m[1] <= c && c <= m[3] && m[3] > m[1] && m[0] <= r && r <= m[2])) widths[c] = Math.max(widths[c], Math.min(60, dwidth(shown) + 2));
        }
        cell.border = BORDER;
        if (r < t.headerRows) {
          cell.font = { bold: true };
          cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF2F2F7' } };
          cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
        }
        const f = t.flags.get(`${r},${c}`);
        if (f) { cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: FILL[f.color] } }; cell.note = f.why; }
      }
    });
    for (const m of t.merges) { try { ws.mergeCells(m[0] + 1, m[1] + 1, m[2] + 1, m[3] + 1); } catch (e) { /* 重叠的合并跳过 */ } }
    widths.forEach((w, c) => { ws.getColumn(c + 1).width = w; });
  });
  // 最后一张：扒表记录
  const ws = wb.addWorksheet(sheetName('扒表记录', used));
  const add = (vals, bold) => { const r = ws.addRow(vals); if (bold) r.font = { bold: true }; return r; };
  add([job.name], true);
  add([`共 ${job.pages} 页，扒出 ${job.tables.length} 张表。${new Date().toLocaleString('zh-CN')}`]);
  add([]);
  add(['表', '在第几页', '行（不算表头）', '列', '表上方那行字', '要看一眼的格子'], true);
  for (const t of job.tables) add([t.sheet, pagesText(t.pages), t.bodyRows, t.ncols, t.caption || '', t.flags.size || '']);
  const flagged = job.tables.flatMap((t) => [...t.flags].map(([k, f]) => { const [r, c] = k.split(',').map(Number); return [t.sheet, `${colName(c)}${r + 1}`, t.cells[r][c] ?? '', f.why]; }));
  if (flagged.length) {
    add([]);
    add(['要看一眼的格子（表里同样标了颜色，鼠标放上去能看原因）'], true);
    add(['表', '格子', '扒到的字', '为什么'], true);
    flagged.slice(0, 5000).forEach((v) => add(v));
  }
  if (job.issues.length) {
    add([]);
    add(['扫描页'], true);
    job.issues.forEach(([p, why]) => add([`第 ${p} 页`, why]));
  }
  if (job.fulltext) {
    add([]);
    add(['没找到表，正文按行放在下面'], true);
    job.fulltext.forEach((row) => add(row));
  }
  [12, 14, 16, 8, 40, 60].forEach((w, i) => { ws.getColumn(i + 1).width = w; });
  const buf = await wb.xlsx.writeBuffer();
  return new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

// ================================================================ 页面
let pdfjs = null;
async function lib() {
  if (!pdfjs) {
    try { pdfjs = await import(PDFJS + 'legacy/build/pdf.min.mjs'); }
    catch (e) { throw new Error('读 PDF 的库没从网上下载下来（cdn.jsdelivr.net），网络好了刷新再试'); }
    pdfjs.GlobalWorkerOptions.workerSrc = PDFJS + 'legacy/build/pdf.worker.min.mjs';
  }
  return pdfjs;
}
const store = {
  get keys() { try { return JSON.parse(localStorage.getItem('pabiao.keys') || '[]'); } catch (e) { return []; } },
  set keys(v) { localStorage.setItem('pabiao.keys', JSON.stringify(v)); },
  get model() { return localStorage.getItem('pabiao.model') || DEFAULT_MODEL; },
  set model(v) { localStorage.setItem('pabiao.model', v); },
};
function show(id) {
  for (const s of ['s-idle', 's-work', 's-done']) $('#' + s).hidden = s !== id;
  T.phase = id.slice(2);
}
function say(msg) { $('#w-status').textContent = msg; T.log.push(msg); }
function bar(frac) { $('#w-bar').style.width = `${Math.round(Math.max(0, Math.min(1, frac)) * 100)}%`; }

let job = null;     // 当前这份：{file, name, doc, pages, tables, blob, ...}

async function start(file) {
  if (!file) return;
  if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') { job = null; finish({ error: `「${file.name}」不是 PDF。贫僧只吃 PDF。` }); return; }
  job = { file, name: file.name.replace(/\.pdf$/i, ''), issues: [] };
  T.result = null;
  $('#w-name').textContent = file.name;
  $('#w-meta').textContent = `${(file.size / 1048576).toFixed(file.size < 1048576 ? 2 : 1)} MB`;
  $('#preview').hidden = true;
  show('s-work'); bar(0); say('');
  try {
    const L = await lib();
    say('打开 PDF…');
    const data = new Uint8Array(await file.arrayBuffer());
    try {
      job.doc = await L.getDocument({ data, cMapUrl: PDFJS + 'cmaps/', cMapPacked: true, standardFontDataUrl: PDFJS + 'standard_fonts/',
        wasmUrl: PDFJS + 'wasm/', iccUrl: PDFJS + 'iccs/', isEvalSupported: false }).promise;
    } catch (e) {
      if (e && e.name === 'PasswordException') throw new Error('这份 PDF 上了密码锁，贫僧撬不开。先用别的软件去掉密码再丢进来。');
      throw new Error(`这份 PDF 打不开：${e && e.message || e}`);
    }
    const N = job.doc.numPages;
    $('#w-meta').textContent += ` · ${N} 页`;
    job.pages = [];
    for (let p = 1; p <= N; p++) {
      const page = await job.doc.getPage(p);
      const pg = await readPage(page, L.OPS);
      pg.no = p;
      if (!pg.scan && !pg.blank) pg.tables = pageTables(pg);
      else pg.free = [];
      delete pg.items; delete pg.H; delete pg.V;
      job.pages.push(pg);
      page.cleanup();
      say(`第 ${p} / ${N} 页`);
      bar(p / N * (job.pages.some((x) => x.scan) ? 0.4 : 0.92));
      if (p % 2 === 0 || N < 20) await tick();
    }
    await scans();
  } catch (e) {
    finish({ error: e.message || String(e) });
  }
}

// 扫描页：有钥匙先借谷歌（认两遍对答案）；没钥匙、或者谷歌出了岔子，就本地认，照样出表，不停下来
async function scans() {
  const scanPages = job.pages.filter((p) => p.scan);
  const todo = scanPages.filter((p) => p.via !== 'gemini');
  const keys = store.keys.filter(Boolean);
  job.fatal = '';
  if (todo.length && keys.length) {
    const eng = new Engine(keys, store.model, say);
    job.engine = eng;
    let done = 0;
    say(`扫描件 ${todo.length} 页，借谷歌的眼睛看，每页认两遍对答案`);
    const queue = [...todo];
    const worker = async () => {
      while (queue.length && !eng.stopped) {
        const pg = queue.shift();
        try {
          pg.tables = await readScan(job.doc, pg, eng);
          pg.via = 'gemini';
          pg.error = '';
        } catch (e) {
          if (e instanceof Fatal) { eng.fatal = eng.fatal || e.message; eng.stop(); }
          if (e instanceof Stopped || e instanceof Fatal) return;
          pg.error = e instanceof ApiError ? e.raw() : `${e.name || 'Error'}：${e.message}`;
        }
        done++;
        say(`扫描件 ${done} / ${todo.length} 页`);
        bar(0.4 + 0.3 * done / todo.length);
      }
    };
    await Promise.all(Array.from({ length: Math.min(SCAN_AT_ONCE, todo.length) }, worker));
    if (eng.fatal) job.fatal = eng.fatal;
  }
  const need = scanPages.filter((p) => !p.via);
  if (need.length) await localScans(need, keys.length ? 0.7 : 0.4);
  await wrapUp();
}

async function wrapUp() {
  const pages = job.pages;
  job.issues = [];
  for (const p of pages) {      // 扫描页每页怎么认的，写进「扒表记录」
    if (!p.scan) continue;
    const g = p.error || (p.via !== 'gemini' && job.fatal) || '';
    if (!p.tables) job.issues.push([p.no, `扫描件，没认成：${p.localError || g || '不知道为啥'}`]);
    else if (p.via === 'gemini') job.issues.push([p.no, '扫描件，谷歌认的（认两遍对答案）']);
    else job.issues.push([p.no, g ? `扫描件，谷歌没认成（${g}），改成本地认的` : '扫描件，本地认的（没钥匙）']);
  }
  // 每次重新接一遍（补认了扫描页以后要重排）
  const fresh = pages.map((p) => ({ ...p, tables: (p.tables || []).map((t) => ({ ...t, cells: t.cells.map((r) => [...r]), merges: t.merges.map((m) => [...m]), flags: new Map(t.flags) })) }));
  job.tables = joinPages(fresh);
  job.tables.forEach(typeTable);
  job.pagesN = pages.length;
  const scanLeft = pages.filter((p) => p.scan && !p.tables);
  job.fulltext = null;
  if (!job.tables.length && !scanLeft.length) {
    // 一张表都没有：正文按行放进 Excel，别吐空表
    job.fulltext = [];
    for (let p = 1; p <= job.doc.numPages; p++) {
      if (pages[p - 1].ocrLines) { job.fulltext.push(...pages[p - 1].ocrLines); continue; }
      const page = await job.doc.getPage(p);
      const pg = await readPage(page, (await lib()).OPS);
      for (const L of toLines(pg.items)) job.fulltext.push(L.segs.map((s) => s.s));
      page.cleanup();
    }
  }
  say('写 Excel…');
  bar(0.96);
  let blob = null;
  if (job.tables.length || job.fulltext) {
    blob = await buildWorkbook({ name: job.file.name, pages: pages.length, tables: job.tables, issues: job.issues, fulltext: job.fulltext && job.fulltext.length ? job.fulltext : null });
    job.blob = blob;
    download();
  }
  bar(1);
  finish({ scanLeft });
}

function download() {
  if (!job || !job.blob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(job.blob);
  a.download = `${job.name}.xlsx`;
  document.body.append(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000);
  T.downloads = (T.downloads || 0) + 1;
}

function finish({ error = '', scanLeft = [] }) {
  show('s-done');
  const flags = job && job.tables ? job.tables.reduce((n, t) => n + t.flags.size, 0) : 0;
  const red = job && job.tables ? job.tables.reduce((n, t) => n + [...t.flags.values()].filter((f) => f.color === 'r').length, 0) : 0;
  const rows = job && job.tables ? job.tables.reduce((n, t) => n + t.bodyRows, 0) : 0;
  const nt = job && job.tables ? job.tables.length : 0;
  const ok = !error && (nt > 0 || (job && job.fulltext));
  $('#d-ok').style.display = ok ? '' : 'none';      // 没干完不打勾
  $('#d-save').hidden = !(job && job.blob);
  $('#d-err').hidden = true;
  $('#d-key').hidden = true;
  $('#d-line2').hidden = true;
  const l2 = (s) => { $('#d-line2').textContent = s; $('#d-line2').hidden = !s; };
  if (error) {
    $('#d-title').textContent = '这份没扒成';
    $('#d-line').textContent = '';
    $('#d-err').textContent = error;
    $('#d-err').hidden = false;
  } else if (nt) {
    $('#d-title').textContent = `扒出 ${nt} 张表，${rows.toLocaleString()} 行`;
    const used = new Set(job.tables.flatMap((t) => [...t.flags.values()].map((f) => f.color)));
    const names = [['y', '黄'], ['o', '橙'], ['r', '红']].filter(([c]) => used.has(c)).map(([, n]) => n).join('、');
    $('#d-line').textContent = flags ? `${flags} 格拿不准，表里标了${names}。Excel 已经下载。干完你核对就好了。` : 'Excel 已经下载。干完你核对就好了。';
  } else if (job && job.fulltext) {
    $('#d-title').textContent = '翻遍了，没找到表';
    $('#d-line').textContent = job.fulltext.length ? '正文按行放进 Excel 了，凑合看。' : '这份 PDF 里一个字都没有。';
    if (!job.fulltext.length) $('#d-save').hidden = true;
  } else {
    $('#d-title').textContent = scanLeft.length === (job.pages || []).length ? '这份是扫描件' : '有字的页里没找到表';
    $('#d-line').textContent = '';
  }
  const local = job && job.pages ? job.pages.filter((p) => p.scan && p.tables && p.via === 'local') : [];
  if (!error && (scanLeft.length || local.length)) {
    const gErr = [job.fatal, ...job.pages.filter((p) => p.scan && p.via !== 'gemini' && p.error).map((p) => `第 ${p.no} 页：${p.error}`)].filter(Boolean);
    const lErr = scanLeft.filter((p) => p.localError).map((p) => `第 ${p.no} 页：${p.localError}`);
    const errs = [...new Set(gErr.concat(lErr))];
    if (errs.length) { $('#d-err').textContent = errs.join('\n'); $('#d-err').hidden = false; }
    const say2 = [];
    if (local.length) {
      const which = pagesText(local.map((p) => p.no));
      if (/HTTP 404/.test(job.fatal)) say2.push(`谷歌说模型名不对（原话在下面），第 ${which} 页先本地认了。点右上角 ⚙ 换个模型，再丢一次更准。`);
      else if (gErr.length) { say2.push(`谷歌那边出了岔子（原话在下面），第 ${which} 页先本地认了。`); showKey(true); }
      else { say2.push(`第 ${which} 页是扫描件，贫僧本地认的，没上传。眼神差点，贴把钥匙更准。`); showKey(false); }
    }
    if (scanLeft.length) say2.push(`第 ${pagesText(scanLeft.map((p) => p.no))} 页没认成，原因在下面。`);
    l2(say2.join(''));
  }
  renderPreview();
  T.phase = 'done';
  T.result = { error, tables: nt, rows, flags, red, scanLeft: scanLeft.map((p) => p.no), fatal: job && job.fatal || '', title: $('#d-title').textContent,
    via: job && job.pages ? job.pages.filter((p) => p.scan).map((p) => [p.no, p.via || '']) : [], line2: $('#d-line2').hidden ? '' : $('#d-line2').textContent };
}
function showKey(retry) {
  $('#d-key').hidden = false;
  $('#d-keyh').textContent = retry ? '换把钥匙，重认一遍' : '贴把钥匙，重认一遍';
  $('#d-keywhy').textContent = retry
    ? '换一把能用的钥匙贴进来，贫僧借谷歌的眼睛重认，Excel 再下一次。'
    : '借谷歌的眼睛重认，每页认两遍对答案，Excel 再下一次。';
  $('#d-keyin').value = '';
}

function renderPreview() {
  const box = $('#pv');
  box.textContent = '';
  if (!job || !job.tables || !job.tables.length) { $('#preview').hidden = true; return; }
  $('#preview').hidden = false;
  const anyFlag = job.tables.some((t) => t.flags.size);
  $('#pv-note').hidden = !anyFlag;
  const MAXT = 12, MAXR = 6;
  job.tables.slice(0, MAXT).forEach((t) => {
    const card = document.createElement('div');
    card.className = 'tcard';
    const tt = document.createElement('div');
    tt.className = 'tt';
    const b = document.createElement('b'); b.textContent = t.sheet;
    const s = document.createElement('span'); s.textContent = `第 ${pagesText(t.pages)} 页 · ${t.bodyRows} 行 × ${t.ncols} 列${t.caption ? ' · ' + t.caption : ''}`;
    tt.append(b, s);
    if (t.flags.size) { const f = document.createElement('span'); f.className = 'flag'; f.textContent = `${t.flags.size} 格要看`; tt.append(f); }
    const sc = document.createElement('div'); sc.className = 'scroll';
    const tb = document.createElement('table'); tb.className = 'pv';
    const covered = new Set();
    for (const m of t.merges) for (let r = m[0]; r <= m[2]; r++) for (let c = m[1]; c <= m[3]; c++) if (r !== m[0] || c !== m[1]) covered.add(`${r},${c}`);
    const last = Math.min(t.cells.length, t.headerRows + MAXR);
    for (let r = 0; r < last; r++) {
      const tr = document.createElement('tr');
      for (let c = 0; c < t.ncols; c++) {
        if (covered.has(`${r},${c}`)) continue;
        const td = document.createElement(r < t.headerRows ? 'th' : 'td');
        const m = t.merges.find((mm) => mm[0] === r && mm[1] === c);
        if (m) { td.colSpan = m[3] - m[1] + 1; td.rowSpan = Math.min(m[2], last - 1) - m[0] + 1; }
        const x = t.typed[r][c];
        td.textContent = t.cells[r][c] ?? '';
        if (x && (x.t === 'n' || x.t === 'd')) td.classList.add('n');
        const f = t.flags.get(`${r},${c}`);
        if (f) { td.classList.add(f.color); td.title = f.why; }
        tr.append(td);
      }
      tb.append(tr);
    }
    sc.append(tb);
    card.append(tt, sc);
    if (t.bodyRows > MAXR) { const mo = document.createElement('div'); mo.className = 'more'; mo.textContent = `…还有 ${(t.bodyRows - MAXR).toLocaleString()} 行，在 Excel 里`; card.append(mo); }
    box.append(card);
  });
  if (job.tables.length > MAXT) { const mo = document.createElement('p'); mo.className = 'more'; mo.textContent = `另外 ${job.tables.length - MAXT} 张表只在 Excel 里。`; box.append(mo); }
}

// ---------------------------------------------------------------- 按钮、拖放、钥匙
const pick = $('#pick');
$('#drop').onclick = () => pick.click();
$('#drop').onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick.click(); } };
pick.onchange = () => { const f = pick.files[0]; pick.value = ''; start(f); };
$('#d-again').onclick = () => { show('s-idle'); $('#preview').hidden = true; pick.click(); };
$('#d-save').onclick = download;
let dragDepth = 0;
addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; $('#drop').classList.add('over'); });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#drop').classList.remove('over'); } });
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', (e) => {
  e.preventDefault(); dragDepth = 0; $('#drop').classList.remove('over');
  const f = [...(e.dataTransfer.files || [])].find((x) => /\.pdf$/i.test(x.name) || x.type === 'application/pdf') || e.dataTransfer.files[0];
  if (f && T.phase !== 'work') start(f);
});
const looksKey = (v) => /^[A-Za-z0-9_.\-]{30,}$/.test(v.trim());
async function resumeWithKey(v) {
  const keys = store.keys;
  keys[0] = v.trim();
  store.keys = keys;
  if (!job || !job.doc) return;
  job.fatal = '';
  for (const p of job.pages) if (p.scan && p.via !== 'gemini') p.error = '';
  show('s-work'); bar(0.4);
  try { await scans(); } catch (e) { finish({ error: e.message || String(e) }); }
}
$('#d-keyin').addEventListener('input', (e) => { if (looksKey(e.target.value)) resumeWithKey(e.target.value); });
$('#d-keyin').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.value.trim()) resumeWithKey(e.target.value); });

const dlg = $('#dlg-set');
$('#model').append(...MODELS.map((m) => new Option(m, m)));
$('#ver').textContent = `v${VERSION}`;
$('#gear').onclick = () => {
  const k = store.keys;
  $('#k1').value = k[0] || ''; $('#k2').value = k[1] || '';
  const m = store.model;
  if (![...$('#model').options].some((o) => o.value === m)) $('#model').append(new Option(m, m));
  $('#model').value = m;
  dlg.showModal();
};
function saveSettings() { store.keys = [$('#k1').value.trim(), $('#k2').value.trim()]; store.model = $('#model').value; }
$('#set-ok').onclick = () => { saveSettings(); dlg.close(); };
dlg.addEventListener('close', saveSettings);
dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
$('#mail').addEventListener('click', () => { try { navigator.clipboard.writeText('oilsongchengmin@gmail.com'); } catch (e) { /* 复制不了就算了 */ } });

T.ready = true;
</script>
